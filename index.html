<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.json">
<title>Champions Battle Tracker</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:#111827;color:white;padding:14px 16px;position:sticky;top:0;z-index:5}
h1{font-size:18px;margin:0}.sub{font-size:12px;color:#cbd5e1;margin-top:3px}
main{max-width:700px;margin:auto;padding:12px 12px 40px}.card{background:white;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px #0001}
label{font-size:12px;color:#475569;display:block;margin:8px 0 5px}
input,select,button{font:inherit}input,select{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:9px;background:white}
.party{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.mon{padding:10px;border:1px solid #cbd5e1;border-radius:10px;background:white;text-align:left}.mon.active{border:2px solid #111827;padding:9px}.mon small{display:block;color:#64748b}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.buttons{display:flex;gap:8px}.buttons button{flex:1}
button{border:0;border-radius:10px;padding:11px;background:#111827;color:white}.secondary{background:#e5e7eb;color:#111827}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px;background:#e5e7eb;margin-top:5px}
.result{background:#f8fafc;border-radius:10px;padding:10px;margin-top:10px}.big{font-size:20px;font-weight:700}
.obs{border-top:1px solid #e5e7eb;padding:9px 0;font-size:13px}.muted{color:#64748b}.danger{color:#b91c1c}
.hidden{display:none}.title{font-weight:700;margin-bottom:8px}
</style>
</head>
<body>
<header><h1>Pokémon Champions Battle Tracker</h1><div class="sub">M-C / 対戦中分析用プロトタイプ</div></header>
<main>
<section class="card">
<div class="title">相手の6体</div>
<div class="party" id="party"></div>
<label>選択中ポケモン</label>
<input id="monName" placeholder="例：ガブリアス">
<div class="row">
<div><label>H努力値</label><input id="hEv" type="number" min="0" max="252" step="4" value="252"></div>
<div><label>レベル</label><input id="level" type="number" min="1" max="100" value="50"></div>
</div>
</section>

<section class="card">
<div class="title">観測を追加</div>
<div class="row">
<div><label>方向</label><select id="direction"><option value="deal">こちら → 相手</option><option value="take">相手 → こちら</option></select></div>
<div><label>技</label><select id="move"></select><div id="category" class="badge">-</div></div>
</div>
<div id="damageArea">
<label id="damageLabel">与えたダメージ（%）</label>
<input id="damage" type="number" min="0" max="100" step="0.1" placeholder="例：42">
</div>
<div class="buttons" style="margin-top:10px">
<button id="add">観測を保存</button><button class="secondary" id="clear">この個体をリセット</button>
</div>
<div class="result">
<div class="muted">現在の推定</div>
<div id="estimate" class="big">B：—　D：—</div>
<div id="offense" class="muted">A：—　C：—</div>
</div>
</section>

<section class="card">
<div class="title">観測履歴</div>
<div id="history" class="muted">まだありません</div>
</section>
</main>
<script>
const moves = [
["物理技","physical"],["特殊技","special"],["変化技","status"],
["テスト：物理技","physical"],["テスト：特殊技","special"]
];
const mons = Array.from({length:6},(_,i)=>({name:"",hEv:252,level:50,obs:[]}));
let selected=0;
const moveEl=document.querySelector("#move"), catEl=document.querySelector("#category");
moves.forEach(([n,c])=>{let o=document.createElement("option");o.textContent=n;o.value=c;moveEl.appendChild(o)});
function renderParty(){
 const p=document.querySelector("#party");p.innerHTML="";
 mons.forEach((m,i)=>{let b=document.createElement("button");b.className="mon"+(i===selected?" active":"");b.innerHTML=`${i+1}. ${m.name||"未登録"}<small>${m.obs.length}件</small>`;b.onclick=()=>{selected=i;load();renderParty()};p.appendChild(b)})
}
function load(){
 const m=mons[selected];document.querySelector("#monName").value=m.name;document.querySelector("#hEv").value=m.hEv;document.querySelector("#level").value=m.level;renderHistory();estimate()
}
function saveFields(){let m=mons[selected];m.name=document.querySelector("#monName").value||"未登録";m.hEv=+document.querySelector("#hEv").value;m.level=+document.querySelector("#level").value}
function updateMove(){
 const c=moveEl.value;catEl.textContent=c==="physical"?"物理 → Bを推定":c==="special"?"特殊 → Dを推定":"変化技 → ダメージ推定なし";
 const dir=document.querySelector("#direction").value;
 document.querySelector("#damageLabel").textContent=dir==="deal"?"与えたダメージ（%）":"受けたダメージ（実数値）";
 document.querySelector("#damage").max=dir==="deal"?100:9999;
 document.querySelector("#damage").placeholder=dir==="deal"?"例：42":"例：86";
}
function estimate(){
 const m=mons[selected], phys=m.obs.filter(x=>x.dir==="deal"&&x.cat==="physical"), spec=m.obs.filter(x=>x.dir==="deal"&&x.cat==="special");
 // UI prototype: retain observations and display a transparent candidate range placeholder.
 // Real Champions damage inversion is deliberately kept separate from the UI layer.
 document.querySelector("#estimate").textContent=`B：${phys.length?"観測あり":"—"}　D：${spec.length?"観測あり":"—"}`;
 const a=m.obs.filter(x=>x.dir==="take"&&x.cat==="physical"), c=m.obs.filter(x=>x.dir==="take"&&x.cat==="special");
 document.querySelector("#offense").textContent=`A：${a.length?"観測あり":"—"}　C：${c.length?"観測あり":"—"}`;
}
function renderHistory(){
 const h=document.querySelector("#history"),m=mons[selected];h.innerHTML="";
 if(!m.obs.length){h.textContent="まだありません";return}
 [...m.obs].reverse().forEach((x,i)=>{let d=document.createElement("div");d.className="obs";d.innerHTML=`<b>${x.dir==="deal"?"こちら→相手":"相手→こちら"}</b> / ${x.cat==="physical"?"物理":x.cat==="special"?"特殊":"変化"} / ${x.damage}${x.dir==="deal"?"%":"ダメージ"}`;h.appendChild(d)})
}
moveEl.onchange=updateMove;document.querySelector("#direction").onchange=updateMove;
document.querySelector("#add").onclick=()=>{saveFields();let m=mons[selected],cat=moveEl.value;if(cat==="status"){alert("変化技ではダメージ観測を登録できません");return}let v=+document.querySelector("#damage").value;if(!Number.isFinite(v)){alert("ダメージを入力してください");return}m.obs.push({dir:document.querySelector("#direction").value,cat,damage:v});document.querySelector("#damage").value="";renderParty();renderHistory();estimate()};
document.querySelector("#clear").onclick=()=>{if(confirm("この個体の観測をすべて消しますか？")){mons[selected].obs=[];renderParty();renderHistory();estimate()}};
document.querySelector("#monName").oninput=()=>{mons[selected].name=document.querySelector("#monName").value;renderParty()};
document.querySelector("#hEv").onchange=saveFields;document.querySelector("#level").onchange=saveFields;
renderParty();load();updateMove();
</script>
</body>
</html>
